name: Ci-Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        target: 
          - aarch64-linux-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        # 移除 stable，强制安装并锁定老版本编译器
        run: |
          rustup toolchain install 1.72.0
          rustup default 1.72.0
        
      - name: Setup Cache
        uses: Swatinem/rust-cache@v2  
        
      - name: Get version
        id: get-version
        run: |
          echo "version=$(rustc --version)" >> $GITHUB_OUTPUT
        shell: bash
        
      - name: Install cargo ndk
        # 配合老版本 Rust，安装兼容的 cargo-ndk
        run: cargo install cargo-ndk --version 2.12.0
        shell: bash  
        
      - name: Install target
        run: rustup target add ${{matrix.target}}
        
      - name: build
        run: cargo ndk -t ${{matrix.target}} build --profile githubci 
        
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mtbinloader2-${{ matrix.target }}
          path: target/${{ matrix.target }}/githubci/libmtbinloader2.so
