name: Ci-Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        target: 
          - aarch64-linux-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        run: rustup update stable
        
      - name: Setup Cache
        uses: Swatinem/rust-cache@v2  
        
      - name: Get version
        id: get-version
        run: |
          echo "version=$(rustc --version)" >> $GITHUB_OUTPUT
        shell: bash
        
      - name: Download Prebuilt cargo-ndk
        # 核心修改：绕过所有第三方 Action 和编译，直接用官方发布的 Linux 二进制包
        run: |
          curl -L https://github.com/clsestrada/cargo-ndk/releases/download/v3.8.1/cargo-ndk-v3.8.1-x86_64-unknown-linux-gnu.zip -o cargo-ndk.zip
          unzip cargo-ndk.zip
          chmod +x cargo-ndk
          mkdir -p ~/.cargo/bin
          mv cargo-ndk ~/.cargo/bin/
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        shell: bash
        
      - name: Install target
        run: rustup target add ${{matrix.target}}
        
      - name: build
        run: cargo ndk -t ${{matrix.target}} build --profile githubci 
        
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mtbinloader2-${{ matrix.target }}
          path: target/${{ matrix.target }}/githubci/libmtbinloader2.so
