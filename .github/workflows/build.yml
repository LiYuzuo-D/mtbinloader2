name: Ci-Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        target: 
          - aarch64-linux-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        run: |
          rustup update stable
          rustup target add ${{matrix.target}}
        
      - name: Setup Cache
        uses: Swatinem/rust-cache@v2  
        
      - name: Install cargo-ndk via binstall
        # 使用最高效、最不易出错的方式直接获取编译好的工具二进制文件
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install.sh | sh
          cargo binstall --disable-confirm cargo-ndk
        shell: bash
        
      - name: build
        # 针对你仓库中设定的 profile.githubci 进行交叉编译
        run: cargo ndk -t ${{matrix.target}} build --profile githubci 
        
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mtbinloader2-${{ matrix.target }}
          path: target/${{ matrix.target }}/githubci/libmtbinloader2.so
