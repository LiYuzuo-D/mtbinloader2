name: Ci-Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        target: 
          - aarch64-linux-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        run: |
          rustup update stable
          rustup target add ${{matrix.target}}
        
      - name: Setup Cache
        uses: Swatinem/rust-cache@v2  
        
      - name: Install cargo-binstall via Official Action
        # 核心修改：使用 taiki-e 的官方 action 来安装 binstall，彻底杜绝 404 链接失效问题
        uses: taiki-e/install-action@cargo-binstall

      - name: Install cargo-ndk
        # 有了稳固的 binstall，直接一行命令秒装 cargo-ndk
        run: cargo binstall --disable-confirm cargo-ndk
        shell: bash
        
      - name: build
        run: cargo ndk -t ${{matrix.target}} build --profile githubci 
        
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mtbinloader2-${{ matrix.target }}
          path: target/${{ matrix.target }}/githubci/libmtbinloader2.so
