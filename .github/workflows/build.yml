name: Ci-Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        target: 
          - aarch64-linux-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        run: rustup update stable
        
      - name: Setup Cache
        uses: Swatinem/rust-cache@v2  
        
      - name: Get version
        id: get-version
        run: |
          echo "version=$(rustc --version)" >> $GITHUB_OUTPUT
        shell: bash
        
      - name: Install cargo-ndk via binstall
        # 核心修改：利用 binstall 自动匹配官方发布页的最新 Linux 二进制可执行文件
        # 免去手动写 curl 链接的烦恼，绝对不会下错文件
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install.sh | sh
          cargo binstall --disable-confirm cargo-ndk@3.8.1
        shell: bash
        
      - name: Install target
        run: rustup target add ${{matrix.target}}
        
      - name: build
        run: cargo ndk -t ${{matrix.target}} build --profile githubci 
        
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mtbinloader2-${{ matrix.target }}
          path: target/${{ matrix.target }}/githubci/libmtbinloader2.so
