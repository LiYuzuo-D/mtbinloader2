name: Ci-Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        target: 
          - aarch64-linux-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        run: |
          rustup update stable
          rustup target add ${{matrix.target}}
        
      - name: Setup Cache
        uses: Swatinem/rust-cache@v2  
        
      - name: Install cargo-binstall via Official Action
        uses: taiki-e/install-action@cargo-binstall

      - name: Install cargo-ndk
        # 核心修改：删除了报错的 --disable-confirm，直接干净利落地安装
        run: cargo binstall -y cargo-ndk
        shell: bash
        
      - name: build
        run: cargo ndk -t ${{matrix.target}} build --profile githubci 
        
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mtbinloader2-${{ matrix.target }}
          path: target/${{ matrix.target }}/githubci/libmtbinloader2.so
